name: Build and deploy - academia-beauty

# Push na main: o CI completo (typecheck, lint, testes com MySQL, auditoria, build) roda primeiro; só se passar as imagens
# Docker são publicadas e, se o Azure estiver configurado (variáveis/segredos abaixo), implantadas.
# Configuração e passos manuais: docs/deploy-azure.md
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  images:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [api, web]
    outputs:
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (o GHCR exige minúsculas)
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/academia-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          # Valores lidos no build do web (rewrites, CSP e validação de mídia). Ignorados na imagem da API.
          build-args: |
            API_ORIGIN=${{ vars.WEB_API_ORIGIN || 'http://localhost:3333' }}
            MEDIA_CDN_HOST=${{ vars.MEDIA_CDN_HOST }}
            CHECKOUT_ALLOWED_HOSTS=${{ vars.CHECKOUT_ALLOWED_HOSTS }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-api:
    needs: images
    if: ${{ vars.AZURE_WEBAPP_API != '' }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_API }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_PUBLISHPROFILE_API }}
          images: ghcr.io/${{ needs.images.outputs.owner }}/academia-api:${{ github.sha }}

  deploy-web:
    needs: [images, deploy-api]
    if: ${{ always() && needs.images.result == 'success' && vars.AZURE_WEBAPP_WEB != '' && (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_WEB }}
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_PUBLISHPROFILE_WEB }}
          images: ghcr.io/${{ needs.images.outputs.owner }}/academia-web:${{ github.sha }}
