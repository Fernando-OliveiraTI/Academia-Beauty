version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      adonisjs:
        patterns: ['@adonisjs/*']
      testing:
        patterns: ['vitest', '@testing-library/*', '@japa/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Uma única PR semanal com todas as ações, em vez de uma por ação.
    groups:
      actions:
        patterns: ['*']
