version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      adonisjs:
        patterns: ['@adonisjs/*']
      testing:
        patterns: ['vitest', '@testing-library/*', '@japa/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
